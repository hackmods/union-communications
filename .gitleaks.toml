# Gitleaks config for CI secret-scan (full-history).
# Prefer fixing real secrets. Allowlist only documented false positives.
title = "UnionOps"

[extend]
useDefault = true

[allowlist]
description = "Documented false positives - demo/test fixtures, storage key names, and plan prose"
regexTarget = "line"
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)src/lib/auth/demo-login-accounts\.ts$''',
  '''(^|/)src/lib/email/mailgun-product-news-webhook\.test\.ts$''',
  '''(^|/)src/lib/comms/letter-contexts\.ts$''',
  '''(^|/)src/lib/access-requests/api-routes\.test\.ts$''',
  '''(^|/)src/lib/customization/api-routes\.test\.ts$''',
  '''(^|/)docs/audit/plan-members-portal-authorization-remaining-2026-09-20\.md$''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef01''',
  '''mailgun-signing-key''',
  '''unionops-letter-handoff-v1''',
  '''roleKey:\\s*"jointLead\\d+"''',
  '''submission-key-16x''',
  '''unassigned-key-16x''',
  '''submission-key-limit''',
  '''deny-publish-1''',
  '''office/assignment/delegation''',
]
