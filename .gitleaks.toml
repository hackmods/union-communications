# Gitleaks config for CI secret-scan (full-history).
# Prefer fixing real secrets. Allowlist only documented false positives.
title = "UnionOps"

[extend]
useDefault = true

[allowlist]
description = "Documented false positives - demo/test fixtures, storage key names, and plan prose"
paths = [
  '''^\.gitleaks\.toml$''',
]
regexes = [
  # Mailgun webhook unit fixture (not a live signing secret)
  '''0123456789abcdef0123456789abcdef0123456789abcdef01''',
  '''mailgun-signing-key''',
  # Browser localStorage handoff key name (not a credential)
  '''unionops-letter-handoff-v1''',
  # Demo roster role key (not an API secret)
  '''jointLead404''',
  # Deterministic test submission / idempotency tokens
  '''submission-key-16x''',
  '''unassigned-key-16x''',
  '''submission-key-limit''',
  '''deny-publish-1''',
  # Plan prose matched as generic-api-key
  '''office/assignment/delegation''',
]
fingerprints = [
