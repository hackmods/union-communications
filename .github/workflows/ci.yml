name: CI

# Two independent paths trigger this workflow:
#   - automatic: push to `main` (CI belt — build, publish, deploy).
#   - manual: workflow_dispatch from the GH UI / GitHub Mobile so an operator
#     can ship a pre-published GHCR tag without waiting for a webhook rebuild
#     (see audit/session-knowledge-2026-09-16-caprover-app-config-drift.md).
# On dispatch the docker-image job is skipped — the operator chose a
# pre-published GHCR tag, which `dispatch-image-scan` pulls and scans before
# deploy; the post-deploy /api/health smoke closes the loop. The test-gate
# (quality + sharded E2E) and standalone dependency/secret scan jobs must pass
# before image publication/deployment; the built image is scanned before
# registry login. PR docs-only diffs may skip the full test belt; main/deploy
# never skips.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR tag to deploy (e.g. "production", "main", "sha-abc1234"). Default: production (live bake).'
        required: false
        type: string
        default: 'production'
      target_url:
        description: 'Full URL to /api/health used by the post-deploy smoke (default: https://unionops.org/api/health). Set this when deploying to a staging URL or non-prod host.'
        required: false
        type: string
        default: 'https://unionops.org/api/health'
      skip_smoke:
        description: 'Skip the post-deploy /api/health smoke check (e.g. when deploying to a non-production host).'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # PR-only allowlist: skip quality/build/E2E when every changed file is docs,
  # markdown, .cursor, or LICENSE*. Push to main and workflow_dispatch always
  # run the full belt (deploy must never skip tests).
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.set.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the full test belt is required
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — full test belt required."
            exit 0
          fi
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if [ -z "$CHANGED" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Empty diff — full test belt required (fail closed)."
            exit 0
          fi
          run_full=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == docs/* || "$f" == .cursor/* || "$f" == *.md || "$f" == LICENSE || "$f" == LICENSE.* ]]; then
              continue
            fi
            run_full=true
            break
          done <<< "$CHANGED"
          echo "run_full=${run_full}" >> "$GITHUB_OUTPUT"
          if [ "$run_full" = "true" ]; then
            echo "Code or config changes detected — full test belt required."
          else
            echo "Docs-only PR allowlist matched — skipping quality/build/E2E."
          fi

  quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Migration history is append-only; the PR gate compares every
          # released journal entry and SQL file with the target branch.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Database migration contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npm run db:check -- --base "origin/$BASE_REF"
          else
            npm run db:check
          fi

      - name: Lint
        run: npm run lint
      - run: npm run check:zoom

      - name: Security workflow contract
        run: npm run check:security-workflows

      - name: DAST target safety contract
        run: npm run check:dast-target

      - name: Typecheck
        run: npm run typecheck

      - name: Public document link registry
        run: npm run check:public-document-links

      - name: Unit tests
        run: npm run test:unit

      - name: Post-deploy readiness gate tests
        run: node --test scripts/verify-host-readiness.test.mjs

  build-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          AUTH_SECRET: ci-build-secret-not-for-production
          NEXT_PUBLIC_OFFICER_HUB_PUBLIC: "true"
          NEXT_PUBLIC_DEMO_SITE: "true"
          # Optional — readable Sentry stack traces when the org secret is set.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: union-ops
          SENTRY_PROJECT: javascript-nextjs
        run: npm run build

      - name: Upload standalone build for E2E shards
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone-build
          path: |
            .next/standalone
            .next/static
            public
          # Nested `.next/` inside standalone (BUILD_ID, server chunks) is hidden;
          # v4+ excludes hidden paths by default and breaks `npm start`.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  e2e-smoke:
    needs: [detect-changes, build-app]
    if: needs.detect-changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download standalone build
        uses: actions/download-artifact@v7
        with:
          name: next-standalone-build
          path: .

      - name: Verify standalone build artifact
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -f .next/standalone/.next/BUILD_ID
          test -d .next/static
          echo "Standalone artifact OK (BUILD_ID=$(cat .next/standalone/.next/BUILD_ID))"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          # ubuntu-latest ships Microsoft apt feeds that can break `apt update` (NOSPLIT / unsigned).
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
            /etc/apt/sources.list.d/microsoft*.sources \
            /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
          npx playwright install chromium --with-deps

      - name: E2E smoke (shard ${{ matrix.shard }}/4)
        env:
          CI: "true"
          AUTH_SECRET: ci-build-secret-not-for-production
          # Production standalone start disables the demo roster unless opted in
          # (isDemoAuthEnabled). Without this, hub/portal @smoke spins on
          # CredentialsSignin until the job is cancelled.
          AUTH_ALLOW_DEMO_USERS: "true"
          NEXT_PUBLIC_DEMO_SITE: "true"
          NEXT_PUBLIC_OFFICER_HUB_PUBLIC: "true"
        run: npx playwright test --grep @smoke --shard=${{ matrix.shard }}/4

  # Thin gate so deploy (and branch protection) wait on one job name whether
  # the full belt ran or a docs-only PR intentionally skipped it.
  test-gate:
    needs: [detect-changes, quality, e2e-smoke]
    if: always() && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require quality + E2E (or intentional docs-only skip)
        env:
          RUN_FULL: ${{ needs.detect-changes.outputs.run_full }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e-smoke.result }}
        run: |
          set -euo pipefail
          if [ "$RUN_FULL" != "true" ]; then
            echo "Docs-only PR allowlist — full test belt intentionally skipped."
            exit 0
          fi
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "::error::quality job result was '${QUALITY_RESULT}' (expected success)."
            exit 1
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::e2e-smoke job result was '${E2E_RESULT}' (expected success)."
            exit 1
          fi
          echo "test-gate OK: quality + e2e-smoke succeeded."

  # Keep release security checks separate from E2E so image publication does
  # not wait for the full browser suite.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Dependency audit
        shell: bash
        run: |
          audit_file="$RUNNER_TEMP/npm-audit.json"
          npm audit --json > "$audit_file" || audit_status=$?
          if [ "${audit_status:-0}" -gt 1 ]; then
            echo "npm audit exited unexpectedly with status ${audit_status}."
          fi
          node scripts/check-npm-audit.mjs \
            "$audit_file" \
            .github/security/npm-audit-exceptions.json \
            "${audit_status:-0}"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan the repository's full history, not only the checked-out tree.
          fetch-depth: 0

      - name: Scan Git history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb # v8.30.1 linux/amd64
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 --log-opts=--all .

  # Docker build + GHCR publish run independently of E2E so CapRover can pull a
  # pre-built image instead of rebuilding on a small droplet (BuildKit export failures).
  docker-image:
    needs: [security-audit, secret-scan]
    outputs:
      # Demo/workshop bake (NEXT_PUBLIC_DEMO_SITE=true) — :main / :sha-<7>
      published_image_ref: ${{ steps.verify-ghcr.outputs.image_ref }}
      # Live CapRover bake (NEXT_PUBLIC_DEMO_SITE=false) — :production
      published_production_image_ref: ${{ steps.verify-production.outputs.image_ref }}
    # Skip on workflow_dispatch — the operator chose a pre-published GHCR tag
    # and the build/push cycle would waste ~5 min. The deploy step validates
    # the chosen tag exists before invoking caprover.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker build smoke
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            EXTRA_ARGS+=(--build-arg "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" --build-arg SENTRY_ORG=union-ops --build-arg SENTRY_PROJECT=javascript-nextjs)
          fi
          if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ]; then
            EXTRA_ARGS+=(--build-arg "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN")
          fi
          docker build -f docker/Dockerfile -t union-communications:ci \
            --build-arg AUTH_SECRET=build-time-placeholder-not-used-at-runtime \
            --build-arg CAPROVER_GIT_COMMIT_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_OFFICER_HUB_PUBLIC=true \
            --build-arg NEXT_PUBLIC_DEMO_SITE=true \
            --build-arg NEXT_PUBLIC_EMAIL_ENABLED=true \
            "${EXTRA_ARGS[@]}" \
            .

      - name: Docker migrate smoke
        run: bash scripts/docker-migrate-smoke.sh union-communications:ci

      - name: Scan built image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: union-communications:ci
          format: json
          output: trivy-image-report.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          version: v0.74.0

      - name: Retain image scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report-${{ github.sha }}
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push demo / workshop image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker tag union-communications:ci "${IMAGE}:main"
          docker tag union-communications:ci "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
      # Verify the GHCR publish ships what we just built. PR #88 only
      # fails loud on the deploy job when secrets are missing; this
      # catches stale :main tags (expired token, registry republish
      # race) before the deploy job rolls them out.
      - name: Verify GHCR :main tag matches this push
        id: verify-ghcr
        # Parentheses document left-to-right &&/|| grouping: push+main, or dispatch.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA=${EXPECTED_SHA::7}
          REPO="${{ github.repository }}"
          echo "comparing ghcr.io/${REPO}:main with :sha-${SHORT_SHA}"
          # Use --format '{{.Manifest.Digest}}' (capitalised, nested under
          # .manifest in the Go template) so the digest comes back as a
          # single plain string. The earlier --raw + '.[0].digest' was
          # wrong two ways: --raw returns the bare manifest body which has
          # no top-level array on single-arch images (it is
          # `{schemaVersion, mediaType, config, layers}`), and on multi-arch
          # indices is `{mediaType, manifests:[…]}` — '.[0]' would scrape
          # the wrong field. The --format template avoids any JSON-shape
          # guessing. Docker 29.x reports the digest at .manifest.digest;
          # older Docker used .Digest — the nested form is forward-compatible.
          # For multi-arch images this returns the index digest; for
          # single-arch (today) the manifest digest. Two identical
          # builds ⇒ identical digests either way.
          main_digest="$(docker buildx imagetools inspect "ghcr.io/${REPO}:main"          --format '{{.Manifest.Digest}}')"
          sha_digest="$(docker buildx imagetools inspect "ghcr.io/${REPO}:sha-${SHORT_SHA}" --format '{{.Manifest.Digest}}')"
          # buildx prints the literal string "<no value>" when the templated
          # field is missing (e.g. registry hasn't published the manifest
          # yet). Fail closed because deployment must receive a digest for
          # the image that was just scanned and pushed.
          if [ "$main_digest" = "<no value>" ] || [ -z "$main_digest" ]; then
            echo "::error::main digest not readable; cannot prove which image was published."
            exit 1
          fi
          if [ "$sha_digest" = "<no value>" ] || [ -z "$sha_digest" ]; then
            echo "::error::sha-${SHORT_SHA} digest not readable; cannot prove which image was published."
            exit 1
          fi
          if [ "$main_digest" != "$sha_digest" ]; then
            echo "::error::GHCR drift: :main digest ($main_digest) != :sha-${SHORT_SHA} digest ($sha_digest). Re-run the docker-image job or re-tag :main to match (ghcr.io API)."
            exit 1
          fi
          echo "GHCR :main === :sha-${SHORT_SHA} === ${main_digest}"
          echo "image_ref=ghcr.io/${REPO}@${sha_digest}" >> "$GITHUB_OUTPUT"

      - name: Build and push production hardened image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            EXTRA_ARGS+=(--build-arg "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" --build-arg SENTRY_ORG=union-ops --build-arg SENTRY_PROJECT=javascript-nextjs)
          fi
          if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ]; then
            EXTRA_ARGS+=(--build-arg "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN")
          fi
          docker buildx build --load -f docker/Dockerfile \
            -t ghcr.io/${{ github.repository }}:production \
            --build-arg AUTH_SECRET=build-time-placeholder-not-used-at-runtime \
            --build-arg CAPROVER_GIT_COMMIT_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_OFFICER_HUB_PUBLIC=true \
            --build-arg NEXT_PUBLIC_DEMO_SITE=false \
            --build-arg NEXT_PUBLIC_EMAIL_ENABLED=true \
            "${EXTRA_ARGS[@]}" \
            .

      - name: Scan production-configured image for critical and high vulnerabilities
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:production
          format: json
          output: trivy-production-image-report.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          version: v0.74.0

      - name: Retain production image scan report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-production-image-report-${{ github.sha }}
          path: trivy-production-image-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Push production hardened image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository }}:production

      - name: Verify GHCR :production tag matches this push
        id: verify-production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          digest="$(docker buildx imagetools inspect "ghcr.io/${REPO}:production" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "<no value>" ]; then
            echo "::error::GHCR :production digest not readable after push."
            exit 1
          fi
          echo "GHCR :production === ${digest} (commit ${EXPECTED_SHA})"
          echo "image_ref=ghcr.io/${REPO}@${digest}" >> "$GITHUB_OUTPUT"

  # Manual dispatch can select a prebuilt tag, so scan that exact registry
  # image too. This prevents a skipped build job from becoming a scan bypass.
  dispatch-image-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}
    steps:
      - name: Resolve selected image
        id: image
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-production}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid GHCR image tag."
            exit 1
          fi
          echo "image=ghcr.io/${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for image pull
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull selected deploy image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker pull "$IMAGE"

      - name: Resolve pulled image digest
        id: digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          IMAGE_REF="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve the selected GHCR tag to an immutable image digest."
            exit 1
          fi
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Scan selected deploy image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest.outputs.image_ref }}
          format: json
          output: trivy-dispatch-image-report.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          version: v0.74.0

      - name: Retain selected image scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-dispatch-image-report-${{ github.run_id }}
          path: trivy-dispatch-image-report.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: [docker-image, dispatch-image-scan, test-gate, security-audit, secret-scan]
    # Trigger on push to main (auto-deploy from CI image) OR on
    # workflow_dispatch (operator chose a pre-published GHCR tag via the
    # GH UI — see the workflow_dispatch inputs above this file).
    # `always()` is required so workflow_dispatch still runs when the
    # docker-image job is intentionally skipped (pre-published tag). Successful
    # test-gate and security-audit jobs are required for every deploy path.
    if: |
      always() &&
      needs.test-gate.result == 'success' &&
      needs.security-audit.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          needs.dispatch-image-scan.result == 'success'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.docker-image.result == 'success' &&
          needs.dispatch-image-scan.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve scanned image digest
        id: image
        env:
          # Live CapRover host pulls the non-demo bake. :main stays available for
          # workshop hosts (NEXT_PUBLIC_DEMO_SITE=true) via workflow_dispatch.
          PUSH_IMAGE_REF: ${{ needs.docker-image.outputs.published_production_image_ref }}
          DISPATCH_IMAGE_REF: ${{ needs.dispatch-image-scan.outputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_IMAGE_REF" ]; then
            IMAGE_REF="$DISPATCH_IMAGE_REF"
          else
            IMAGE_REF="$PUSH_IMAGE_REF"
          fi
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[a-f0-9]{64}$ ]]; then
            echo "No verified scanned image digest is available for deployment."
            exit 1
          fi
          echo "Deploying verified image digest ${IMAGE_REF}"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Validate target image exists in GHCR
        env:
          IMAGE: ${{ steps.image.outputs.IMAGE_REF }}
        run: |
          # Pre-flight the registry before invoking caprover-cli — the CLI
          # would otherwise yield a less diagnostic error than "tag not found".
          # Use --format '{{.Manifest.Digest}}' so we get a plain string. The
          # earlier --raw + jq -e '.[0]' was wrong (--raw returns the
          # bare manifest body which has no top-level array on single-arch
          # images; Docker 29.x's default JSON shape also moved .digest
          # under .manifest). The path .manifest.digest is the canonical
          # digest location for both manifest-list and single-arch images.
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "<no value>" ]; then
            echo "::error::Image ${IMAGE} not found in GHCR. Confirm the image was published (the docker-image job only runs on push to main — workflow_dispatch with a custom tag requires the tag to already exist)."
            exit 1
          fi
          echo "Image ${IMAGE} found in GHCR (digest=${digest})."

      - name: Deploy pre-built GHCR image to CapRover
        id: deploy
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_WEBHOOK_URL: ${{ secrets.CAPROVER_WEBHOOK_URL }}
          IMAGE: ${{ steps.image.outputs.IMAGE_REF }}
          EXPECTED_COMMIT: ${{ github.sha }}
          TARGET_HEALTH: ${{ github.event.inputs.target_url || 'https://unionops.org/api/health' }}
        run: |
          # Trim accidental paste whitespace / newlines from GH secrets.
          CAPROVER_SERVER="$(printf '%s' "${CAPROVER_SERVER:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          CAPROVER_PASSWORD="$(printf '%s' "${CAPROVER_PASSWORD:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          CAPROVER_APP="$(printf '%s' "${CAPROVER_APP:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -n "$CAPROVER_SERVER" ] && [ -n "$CAPROVER_PASSWORD" ] && [ -n "$CAPROVER_APP" ]; then
            # CAPROVER_APP must be the CapRover Apps-list name (e.g. union-communications),
            # never a URL. CAPROVER_SERVER must be the captain root, not the app FQDN.
            if printf '%s' "$CAPROVER_APP" | grep -Eqi 'https?://|/'; then
              echo "::error::CAPROVER_APP looks like a URL/path. Set it to the CapRover app name only (e.g. union-communications), not https://union-communications.behind7proxies.com/."
              exit 1
            fi
            if printf '%s' "$CAPROVER_SERVER" | grep -Eqi 'union-communications\.behind7proxies\.com|unionops\.org'; then
              echo "::error::CAPROVER_SERVER looks like the app/public host, not the CapRover captain. Expected https://captain.behind7proxies.com (docs/guides/DEPLOY.md)."
              exit 1
            fi
            echo "Deploying ${IMAGE} to CapRover app ${CAPROVER_APP} (pull only — no on-host build)."
            echo "caproverUrl host: $(printf '%s' "$CAPROVER_SERVER" | sed -E 's#^https?://##;s#/.*##')"
            echo "caproverApp length: ${#CAPROVER_APP}"
            set +e
            deploy_out="$(docker run --rm caprover/cli-caprover:2.2.3 caprover deploy \
              --caproverUrl "$CAPROVER_SERVER" \
              --caproverPassword "$CAPROVER_PASSWORD" \
              --caproverApp "$CAPROVER_APP" \
              --imageName "$IMAGE" 2>&1)"
            deploy_rc=$?
            set -e
            printf '%s\n' "$deploy_out"
            if [ "$deploy_rc" -ne 0 ]; then
              if printf '%s' "$deploy_out" | grep -qi 'app not exist'; then
                echo "::error::CapRover authenticated but app '${CAPROVER_APP}' was not found on ${CAPROVER_SERVER}."
                echo "::notice::Listing apps on that captain so you can fix CAPROVER_APP or CAPROVER_SERVER."
                login_json="$(curl -fsS --max-time 30 -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'x-namespace: captain' \
                  -d "{\"password\":$(printf '%s' "$CAPROVER_PASSWORD" | jq -Rs .)}" \
                  "${CAPROVER_SERVER%/}/api/v2/login" 2>/dev/null || true)"
                token="$(printf '%s' "$login_json" | jq -r '.data.token // empty' 2>/dev/null || true)"
                if [ -n "$token" ]; then
                  apps_json="$(curl -fsS --max-time 30 \
                    -H "x-captain-auth: ${token}" \
                    -H 'x-namespace: captain' \
                    "${CAPROVER_SERVER%/}/api/v2/user/apps/appDefinitions" 2>/dev/null || true)"
                  apps="$(printf '%s' "$apps_json" | jq -r '[.data.appDefinitions[]?.appName] | join(", ")' 2>/dev/null || true)"
                  if [ -n "$apps" ]; then
                    echo "::error::Apps on this CapRover machine: ${apps}"
                  else
                    echo "::warning::Could not parse app list from captain (empty machine or unexpected API shape)."
                  fi
                else
                  echo "::warning::Could not list apps after deploy failure (login token missing)."
                fi
              fi
              exit "$deploy_rc"
            fi
            echo "CapRover image deploy triggered."
            echo "DEPLOYED_IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CAPROVER_WEBHOOK_URL" ]; then
            # A git webhook rebuilds `next build` on the droplet, which OOM-SIGKILLs
            # on small hosts (session-knowledge-2026-09-16-build-oom.md). Never fall
            # back to it silently — surface it as the failure it is so the operator
            # sets the CLI-secret image deploy instead.
            echo "::error::CAPROVER_SERVER/PASSWORD/APP not set — refusing to fall back to the OOM-prone git webhook rebuild. Set CAPROVER_SERVER, CAPROVER_PASSWORD, CAPROVER_APP for a pull-only GHCR image deploy."
            echo "::warning::CAPROVER_WEBHOOK_URL is set but unused (image deploy requires CAPROVER_SERVER/PASSWORD/APP)."
            echo "::notice::Manual escape hatch: use the workflow_dispatch trigger on this workflow with no secrets (the deploy step still runs the secrets check, but the manual path bypasses the push webhook). See docs/audit/session-knowledge-2026-09-16-caprover-app-config-drift.md."
            exit 1
          fi
          # CLI secrets unset. CapRover may still roll :main via Method 1 (git
          # webhook) or a Method 3 force from the captain UI — both are
          # independent of this job. Poll /api/health for this SHA before
          # failing; if the host already reports tip, warn and continue so
          # main CI stays green while still loud about the missing secrets.
          # Prefer restoring CAPROVER_SERVER/PASSWORD/APP so CI can Method-3
          # pull without an on-droplet rebuild (OOM risk on small hosts).
          set -euo pipefail
          SHORT_COMMIT=${EXPECTED_COMMIT::7}
          TARGET="${TARGET_HEALTH}"
          echo "::warning::No CapRover CLI secrets (CAPROVER_SERVER/PASSWORD/APP). Cannot pull-deploy ${IMAGE} from CI."
          echo "::notice::Polling ${TARGET} for commit ${EXPECTED_COMMIT} in case CapRover's independent deploy path already rolled this SHA (docs/audit/session-knowledge-2026-09-16-caprover-app-config-drift.md)."
          # CapRover Method 1 rebuilds often finish ~10–12 min after the push
          # (docker-image already burned ~5 min). Budget 40×15s ≈ 10 min here
          # so tip can land a few minutes after GHCR publish without failing CI.
          for i in $(seq 1 40); do
            sleep 15
            body="$(curl -fsSL --max-time 30 "${TARGET}" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              reported="$(echo "$body" | jq -r '.commit // empty')"
              built="$(echo "$body" | jq -r '.builtAt // empty')"
              if [ "$reported" = "$EXPECTED_COMMIT" ] || [ "$reported" = "$SHORT_COMMIT" ]; then
                echo "::warning::Production already reports commit=${reported} builtAt=${built} without CI CapRover CLI secrets. Restore CAPROVER_SERVER, CAPROVER_PASSWORD, CAPROVER_APP so the next push uses Method 3 image pull (no on-droplet next build)."
                echo "EXTERNAL_DEPLOY_CONFIRMED=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "  retry ${i}/40 — ${TARGET} did not yet report ${EXPECTED_COMMIT}; current body: ${body:-<unreachable>}"
          done
          echo "::warning::No CapRover deploy secrets and ${TARGET} did not report ${EXPECTED_COMMIT} within ~10min. GHCR tip ${IMAGE} is published; production tip is still stale. Restore CAPROVER_SERVER, CAPROVER_PASSWORD, CAPROVER_APP for pull-only deploy, or force Method 3 in CapRover UI. Docs: docs/guides/DEPLOY.md §When deploy job fails loud."
          # Exit 0 so code/image gates on main stay green when CLI secrets are
          # unset. Real CapRover CLI deploy failures (secrets present) still
          # fail the job above. Operator must restore secrets or Method 3.
          exit 0

      # Probe CapRover for the app's reported state. caprover-cli exits 0
      # once the deploy request is accepted but CapRover's restart cycle
      # can lag — and the worst case is that the app's webhook Method 1
      # fired an on-droplet rebuild that OOM'd, leaving the previous
      # container running. Querying the captain API right after the
      # deploy tells us what /api/health WILL say in 30 seconds and
      # whether the smoke step is going to be a transient retry or a real
      # alarm. If the caprover API call fails (older captain versions
      # without /appData, or auth glitch), the step warns and continues.
      - name: Probe CapRover app state after deploy
        if: ${{ steps.deploy.outputs.DEPLOYED_IMAGE != '' }}
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          DEPLOYED_IMAGE: ${{ steps.deploy.outputs.DEPLOYED_IMAGE }}
        run: |
          # Brief settling window so CapRover's admin API has the post-deploy
          # view of the world. 5s is empirically enough.
          sleep 5
          resp="$(curl -fsS -u "captain:${CAPROVER_PASSWORD}" \
            "${CAPROVER_SERVER}/api/v2/user/apps/appData/${CAPROVER_APP}" 2>/dev/null || true)"
          if [ -z "$resp" ]; then
            echo "::warning::could not query CapRover /appData (older captain version or transient auth glitch); smoke step will rely on /api/health alone."
            exit 0
          fi
          echo "CapRover appData response (relevant fields):"
          # Parenthesize // inside object constructors — bare
          # `.field // null` is a jq syntax error in object values.
          echo "$resp" | jq '{appName, imageName, isAppBuilding, deploymentMethod, appContainerInfo: (.appContainerInfo // null)}' || echo "$resp" | head -c 2000
          running="$(echo "$resp" | jq -r '(.imageName // .appContainerInfo.imageName // "(unknown)")')"
          echo "running imageName: ${running}"
          expected="$DEPLOYED_IMAGE"
          echo "expected imageName: ${expected}"
          # CapRover strips the registry hostname from appContainerInfo.imageName
          # in some captain versions; compare on the trailing path.
          short_running="$(echo "$running" | awk -F'/' '{print $NF}')"
          short_expected="$(echo "$expected" | awk -F'/' '{print $NF}')"
          if [ -n "$running" ] && [ "$running" != "(unknown)" ] && [ "$short_running" != "$short_expected" ]; then
            echo "::warning::CapRover app reported imageName (${running}) does not match the deployed tag (${expected}). The next /api/health smoke will almost certainly fail until CapRover restarts the container with the new image."
            echo "::notice::Common cause: the CapRover app is still on Method 1 (git webhook) and the webhook rebuild OOM'd. docs/audit/session-knowledge-2026-09-16-caprover-app-config-drift.md has the operator fix (flip the app's Deployment Method to Method 3: Use Docker Image)."
          fi

      # Post-deploy /api/health smoke. Polls the target host for the new
      # live commit SHA and fails loud when the deployment is stale (image
      # pulled but CapRover didn't restart cleanly, or it restarted with
      # the prior image). The endpoint URL is configurable via the
      # workflow_dispatch `target_url` input so non-prod hosts (staging,
      # demo instances) can smoke their own /api/health instead of
      # unionops.org. Push runs use the default URL.
      #
      # Bumped from 100s → 5min in 2026-09-17: the prior 10×10s budget was
      # tuned for fast GH-only restarts and underestimates CapRover's
      # restart+healthcheck cycle on a small droplet. 20×15s covers the
      # 4-5 min worst case where the captain proxy has to rebuild its
      # view-of-the-world after a webhook-driven or image-driven rollout.
      # Only smoke when CapRover actually accepted an image deploy —
      # otherwise we burn ~5min polling a commit that was never shipped.
      - name: Post-deploy /api/health smoke
        if: ${{ steps.deploy.outputs.DEPLOYED_IMAGE != '' && github.event.inputs.skip_smoke != true }}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYED_IMAGE: ${{ steps.deploy.outputs.DEPLOYED_IMAGE }}
          TARGET_HEALTH: ${{ github.event.inputs.target_url || 'https://unionops.org/api/health' }}
        run: |
          set -euo pipefail
          SHORT_COMMIT=${EXPECTED_COMMIT::7}
          TARGET="${TARGET_HEALTH}"
          echo "smoking ${TARGET} — expecting commit ${EXPECTED_COMMIT} (short=${SHORT_COMMIT}) from image ${DEPLOYED_IMAGE}"
          for i in $(seq 1 20); do
            sleep 15
            body="$(curl -fsSL --max-time 30 "${TARGET}" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              reported="$(echo "$body" | jq -r '.commit // empty')"
              built="$(echo "$body" | jq -r '.builtAt // empty')"
              # .commit may be reported as either full SHA or short SHA
              # depending on the build stamp; accept both.
              if [ "$reported" = "$EXPECTED_COMMIT" ] || [ "$reported" = "$SHORT_COMMIT" ]; then
                echo "smoke OK: ${TARGET} reports commit=${reported} builtAt=${built}"
                exit 0
              fi
            fi
            echo "  retry ${i}/20 — ${TARGET} did not yet report ${EXPECTED_COMMIT}; current body: ${body:-<unreachable>}"
          done
          echo "::error::post-deploy smoke failed: ${TARGET} did not report ${EXPECTED_COMMIT} within ~5min."
          echo "::error::Three tests in order:"
          echo "::error::  (1) Is the CapRover app's Deployment Method set to 'Use Docker Image' (Method 3) instead of 'Deploy from GitHub' (Method 1)? The webhook rebuild OOMs on small droplets."
          echo "::error::  (2) Did caprover-cli actually accept the deploy? Grep the prior 'Deploy pre-built GHCR image to CapRover' step output for the captain API response — if it returned a 4xx the deploy was rejected."
          echo "::error::  (3) Is the running container's network or image-pull policy blocking CapRover from re-tagging the image? Force a redeploy from the CapRover UI's 'Restart' button on the app's Deployment tab."
          echo "::error::Docs: docs/audit/session-knowledge-2026-09-16-caprover-app-config-drift.md (L-α, L-β)."
          exit 1

      - name: Post-deploy host readiness gate
        if: ${{ (steps.deploy.outputs.DEPLOYED_IMAGE != '' || steps.deploy.outputs.EXTERNAL_DEPLOY_CONFIRMED == '1') && github.event.inputs.skip_smoke != true }}
        env:
          HEALTH_URL: ${{ github.event.inputs.target_url || 'https://unionops.org/api/health' }}
          REQUIRE_HOSTED_CUSTOMER_MODE: "true"
          HOST_READINESS_SECRET: ${{ secrets.HOST_READINESS_SECRET }}
        run: |
          set -euo pipefail
          # Mirrors buildHostReadiness: customer mode blocks without production
          # TOTP and current storage/scanner/backup/alert/contact evidence.
          node scripts/verify-host-readiness.mjs

      # Do not reference secrets.* in step `if:` — GitHub rejects the whole workflow
      # at parse time (0s / 0 jobs). Gate emptiness inside the script instead.
      - name: Post-deploy upgrade email (optional)
        if: ${{ steps.deploy.outputs.DEPLOYED_IMAGE != '' && github.event.inputs.skip_smoke != true }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_ORIGIN: ${{ github.event.inputs.target_url || 'https://unionops.org/api/health' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET not set — skipping deploy-notify"
            exit 0
          fi
          # Strip /api/health suffix if present
          ORIGIN="${TARGET_ORIGIN%/api/health}"
          ORIGIN="${ORIGIN%/}"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ORIGIN}/api/cron/deploy-notify" \
            || echo "::warning::deploy-notify cron failed or is disabled on the host (non-blocking)"
