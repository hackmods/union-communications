name: Staging DAST

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-target:
    runs-on: ubuntu-latest
    outputs:
      scan_enabled: ${{ steps.validate.outputs.scan_enabled }}
      target_url: ${{ steps.validate.outputs.target_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate allowlisted staging target
        id: validate
        env:
          DAST_STAGING_URL: ${{ vars.DAST_STAGING_URL }}
        run: node scripts/prepare-dast-target.mjs

  zap-baseline:
    needs: validate-target
    if: needs.validate-target.outputs.scan_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run passive ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ needs.validate-target.outputs.target_url }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          artifact_name: zap-staging-baseline-${{ github.run_id }}
          allow_issue_writing: false
          fail_action: false
